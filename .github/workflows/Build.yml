name: Build Kernel LineageOS 23.0

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison build-essential curl flex g++ gcc \
            libelf-dev libncurses-dev libssl-dev \
            lz4 rsync unzip zip \
            device-tree-compiler \
            python3 python-is-python3 \
            pahole zstd

      - name: Setup LLVM toolchain (Android / LineageOS)
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains

          curl -L -o clang.tar.gz \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz

          mkdir clang
          tar -xf clang.tar.gz -C clang

          echo "LLVM installed:"
          ls clang/bin | grep -E "clang$|ld.lld"

      - name: Export build environment
        run: |
          echo "CLANG_PATH=$HOME/toolchains/clang/bin" >> $GITHUB_ENV
          echo "PATH=$HOME/toolchains/clang/bin:$PATH" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=@ravindu644" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          which clang
          which ld.lld
          clang --version
          ld.lld --version

      - name: Build kernel (lineage-23.0)
        run: |
          make O=out clean
          make O=out gki_defconfig
          make -j$(nproc) O=out

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lineage-23.0
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
