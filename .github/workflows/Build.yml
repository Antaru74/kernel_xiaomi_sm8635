name: Build Android Kernel 6.1 (lineage-23.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source (lineage-23.0)
        uses: actions/checkout@v4
        with:
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison flex cpio \
            build-essential \
            libssl-dev \
            libelf-dev \
            dwarves \
            python3 \
            wget \
            git \
            xz-utils

      - name: Download ZyC Clang 23
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz
          tar -xf Clang-23.0.0git-20260130.tar.gz

      - name: Setup LLVM environment (CORRECT WAY)
        run: |
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "LLVM_PATH=$HOME/toolchains/Clang-23.0.0git-20260130" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV

      - name: Kernel defconfig (gki_defconfig)
        run: |
          make O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            LLVM_PATH=$HOME/toolchains/Clang-23.0.0git-20260130 \
            gki_defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) O=out \
            LLVM=1 \
            LLVM_IAS=1 \
            LLVM_PATH=$HOME/toolchains/Clang-23.0.0git-20260130

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lineage-23.0
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.lz4
