name: Build Kernel LineageOS 23.0

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.0

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git bc bison build-essential curl flex g++ gcc \
            libelf-dev libncurses-dev libssl-dev \
            lz4 rsync unzip zip \
            device-tree-compiler \
            python3 python-is-python3 \
            pahole zstd

      - name: Setup ZyCromerZ Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains

          # Download ZyCromerZ Clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/23.0.0git-20260130-release/Clang-23.0.0git-20260130.tar.gz

          # Extract Clang
          mkdir clang
          tar -xf Clang-23.0.0git-20260130.tar.gz -C clang --strip-components=1

          # Verify extraction
          echo "LLVM installed:"
          ls clang/bin | grep -E "clang$|ld.lld|clang++"

      - name: Export build environment
        run: |
          echo "CLANG_PATH=$HOME/toolchains/clang/bin" >> $GITHUB_ENV
          echo "CC=$HOME/toolchains/clang/bin/clang" >> $GITHUB_ENV
          echo "CXX=$HOME/toolchains/clang/bin/clang++" >> $GITHUB_ENV
          echo "LD=$HOME/toolchains/clang/bin/ld.lld" >> $GITHUB_ENV
          echo "AR=$HOME/toolchains/clang/bin/llvm-ar" >> $GITHUB_ENV
          echo "NM=$HOME/toolchains/clang/bin/llvm-nm" >> $GITHUB_ENV
          echo "STRIP=$HOME/toolchains/clang/bin/llvm-strip" >> $GITHUB_ENV
          echo "OBJCOPY=$HOME/toolchains/clang/bin/llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=$HOME/toolchains/clang/bin/llvm-objdump" >> $GITHUB_ENV
          echo "READELF=$HOME/toolchains/clang/bin/llvm-readelf" >> $GITHUB_ENV
          echo "PATH=$HOME/toolchains/clang/bin:$PATH" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=@ravindu644" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$HOME/toolchains/clang/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=$HOME/toolchains/clang/bin/arm-linux-gnueabi-" >> $GITHUB_ENV

      - name: Verify toolchain
        run: |
          which clang
          which ld.lld
          clang --version
          ld.lld --version
          echo "CC: $CC"
          echo "LD: $LD"
          echo "AR: $AR"

      - name: Build kernel (lineage-23.0)
        env:
          MAKE_TERMOUT: 1
        run: |
          make O=out clean
          make O=out gki_defconfig
          
          # Build dengan parameter yang lebih spesifik
          make -j$(nproc) \
            O=out \
            ARCH=$ARCH \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            STRIP="$STRIP" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            READELF="$READELF" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-lineage-23.0
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dtbo.img
